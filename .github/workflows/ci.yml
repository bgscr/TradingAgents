name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Personal Windows checks by default; compatibility requires explicit opt-in.
  workflow_dispatch:
    inputs:
      full_compatibility:
        description: Run full compatibility (10 jobs; Linux and other Python versions)
        type: boolean
        required: false
        default: false

concurrency:
  # A requested full run must not cancel (or be cancelled by) the automatic run.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        # Daily matches the personal Windows .venv (verified Python 3.13.7).
        # Only an explicit manual opt-in adds the former compatibility lanes.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_compatibility == true
            && '[{"os":"windows-latest","python-version":"3.13.7"},{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.12"}]'
            || '[{"os":"windows-latest","python-version":"3.13.7"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          # Cache downloads/wheels only; every job still installs and tests afresh.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
            .github/constraints/windows-py3137.txt
      - name: Select test interpreter (fresh Windows venv)
        run: |
          $testPython = '${{ steps.python.outputs.python-path }}'
          if ($env:RUNNER_OS -eq 'Windows') {
            $venvRoot = Join-Path $env:RUNNER_TEMP 'tradingagents-test-venv'
            & $testPython -m venv --copies $venvRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $testPython = Join-Path $venvRoot 'Scripts/python.exe'
            # Keep bare-python subprocesses in the same test environment.
            Split-Path -Parent $testPython | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          "TA_CI_PYTHON=$testPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $testPython -c "import sys; print(sys.executable); print(sys.version)"
      - name: Upgrade pip in test environment
        run: '& $env:TA_CI_PYTHON -m pip install --upgrade pip'
      - name: Install (with dev and PIT extras)
        run: |
          $installArgs = @('-m', 'pip', 'install', '-e', '.[dev,pit]')
          if ($env:RUNNER_OS -eq 'Windows' -and '${{ matrix.python-version }}' -eq '3.13.7') {
            $installArgs += @('--constraint', '.github/constraints/windows-py3137.txt')
          }
          & $env:TA_CI_PYTHON @installArgs
      - name: Cold data-acceptance bootstrap (offline)
        run: '& $env:TA_CI_PYTHON -I -S -B scripts/check_tushare_acceptance_startup.py'
      - name: Lint the repository
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13.7'
        run: '& $env:TA_CI_PYTHON -m ruff check .'
      - name: Run test suite
        run: '& $env:TA_CI_PYTHON -m pytest -q'

  smoke-install:
    name: ${{ matrix.os == 'windows-latest' && 'clean-install smoke' || 'Linux clean-install smoke' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_compatibility == true
            && '[{"os":"windows-latest","python-version":"3.13.7"},{"os":"ubuntu-latest","python-version":"3.12"}]'
            || '[{"os":"windows-latest","python-version":"3.13.7"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Separate steps preserve each native exit code under Windows PowerShell.
      - name: Upgrade pip in fresh environment
        run: python -m pip install --upgrade pip
      - name: Fresh install (no dev extras)
        run: pip install .
      - name: Import installed package and CLI
        # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
        # install must import the package and the CLI module.
        run: python -c "import tradingagents, cli.main; print('clean-install import OK')"

  minimum-compatibility:
    name: minimum dependencies (py3.13)
    if: github.event_name == 'workflow_dispatch' && inputs.full_compatibility == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml
      - name: Install declared minimum compatibility set
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pit]" \
            "pydantic==2.12.0" \
            "langgraph==1.2.0" \
            "tqdm==4.67.1" \
            "typing-extensions==4.14.1" \
            "akshare==1.18.64" \
            "baostock==0.8.9" \
            "yfinance==1.4.1" \
            "hypothesis==6.10.1" \
            "ruff==0.15.0"
      - name: Lint at the declared Ruff floor
        run: ruff check .
      - name: Run test suite at dependency floors
        # Keep every failure and its traceback while avoiding repeated fixture
        # source and captured output overwhelming the downloadable job log.
        run: pytest -q --tb=short --show-capture=no

  windows-package-smoke:
    name: Windows launcher and PyInstaller smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
      - name: Build portable release and smoke launchers
        shell: powershell
        run: .\scripts\build_windows_release.ps1
      - name: Start packaged CLI
        shell: powershell
        run: |
          & .\dist\TradingAgents-Win64\tradingagents.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged CLI failed with exit code $LASTEXITCODE"
          }
