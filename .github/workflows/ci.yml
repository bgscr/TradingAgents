name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev and PIT extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pit]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  minimum-compatibility:
    name: minimum dependencies (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install declared minimum compatibility set
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pit]" \
            "pydantic==2.10.6" \
            "langgraph==1.2.0" \
            "tqdm==4.67.1" \
            "typing-extensions==4.14.0" \
            "akshare==1.18.64" \
            "baostock==0.8.9" \
            "yfinance==1.4.1" \
            "hypothesis==6.10.1" \
            "ruff==0.15.0"
      - name: Run test suite at dependency floors
        run: pytest -q
      - name: Lint at the declared Ruff floor
        run: ruff check .

  windows-package-smoke:
    name: Windows launcher and PyInstaller smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable release and smoke launchers
        shell: powershell
        run: .\scripts\build_windows_release.ps1
      - name: Start packaged CLI
        shell: powershell
        run: |
          & .\dist\TradingAgents-Win64\tradingagents.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged CLI failed with exit code $LASTEXITCODE"
          }

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: ruff check .
